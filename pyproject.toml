[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penex"
version = "0.1.6"
description = "An implementation of the penalized exponential loss in PyTorch"
readme = "README_PyPI.md"
license = { text = "MIT" }
authors = [
    { name = "Klaus-Rudolf Kladny", email = "kkladny@tuebingen.mpg.de" }
]
requires-python = ">=3.9"
keywords = ["loss function", "exponential loss", "pytorch", "regularization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.24,<2"
]

[project.optional-dependencies]
torch = ["torch>=2.0,<3"]
# Opt-in path for NumPy 2 users (who likely have torch>=2.3).
np2 = ["numpy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["penex*"]

[project.urls]
"Homepage" = "https://github.com/rudolfwilliam/penex"